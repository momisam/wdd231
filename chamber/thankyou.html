<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>
<!-- Favicon -->
<link rel="icon" href="images/favicon.ico">
<link rel="stylesheet" href="styles/normalize.css">
<link rel="stylesheet" href="styles/small.css">
<link rel="stylesheet" href="styles/larger.css">
</head>

<body>

<header>
<h1>Thank You!</h1>
</header>

<main>
<h2>Your Application Has Been Received</h2>

<div id="output"></div>

</main>

<footer>
<p>&copy; <span id="year"></span> | FEMI S. MOSES</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("output").innerHTML = `
<p><strong>First Name:</strong> ${params.get("firstname")}</p>
<p><strong>Last Name:</strong> ${params.get("lastname")}</p>
<p><strong>Email:</strong> ${params.get("email")}</p>
<p><strong>Phone:</strong> ${params.get("phone")}</p>
<p><strong>Business:</strong> ${params.get("business")}</p>
<p><strong>Date:</strong> ${params.get("timestamp")}</p>
`;

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
