<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Lagos Chamber of Commerce</title>

<meta name="description" content="Apply to join the Lagos Chamber of Commerce and grow your business network.">
<meta name="author" content="Femi S. Moses">

<link rel="icon" href="images/favicon.ico">

<!-- Open Graph -->
<meta property="og:title" content="Join Lagos Chamber of Commerce">
<meta property="og:description" content="Apply for membership and connect with businesses in Lagos.">
<meta property="og:image" content="https://momisam.github.io/wdd231/chamber/images/hero.jpg">
<meta property="og:url" content="https://momisam.github.io/wdd231/chamber/join.html">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="styles/normalize.css">
<link rel="stylesheet" href="styles/small.css">
<link rel="stylesheet" href="styles/larger.css">

<!-- JS -->
<script src="scripts/join.js" defer></script>

</head>

<body>

<header>
  <h1>Lagos Chamber of Commerce</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="discover.html">Discover</a></li>
      <li><a href="directory.html">Directory</a></li>
      <li><a href="join.html" class="active">Join</a></li>
    </ul>
  </nav>
</header>

<main>

<h2>Membership Application</h2>

<div class="layout">

<form method="get" action="thankyou.html">

<label>
First Name
<input type="text" name="firstname" required title="First Name" autocomplete="given-name">
</label>

<label>
Last Name
<input type="text" name="lastname" required title="Last Name" autocomplete="family-name">
</label>

<label>
Organization Title
<input type="text" name="orgtitle"
pattern="[A-Za-z\\-\\s]{7,}"
title="Minimum 7 characters"
autocomplete="organization-title">
</label>

<label>
Email
<input type="email" name="email" required placeholder="example@email.com" autocomplete="email">
</label>

<label>
Mobile Phone
<input type="tel" name="phone" required autocomplete="tel">
</label>

<label>
Business Name
<input type="text" name="business" required autocomplete="organization">
</label>

<label>
Membership Level
<select name="membership">
<option value="np">NP Membership</option>
<option value="bronze">Bronze</option>
<option value="silver">Silver</option>
<option value="gold">Gold</option>
</select>
</label>

<label>
Business Description
<textarea name="description"></textarea>
</label>

<input type="hidden" id="timestamp" name="timestamp">

<button type="submit">Apply Now</button>

</form>

<!-- CARDS -->
<div class="cards">
  <div class="card"><h3>NP</h3><button data-modal="npModal">Benefits</button></div>
  <div class="card"><h3>Bronze</h3><button data-modal="bronzeModal">Benefits</button></div>
  <div class="card"><h3>Silver</h3><button data-modal="silverModal">Benefits</button></div>
  <div class="card"><h3>Gold</h3><button data-modal="goldModal">Benefits</button></div>
</div>

</div>

<!-- MODALS -->
<div id="npModal" class="modal"><div class="modal-content"><span class="close">&times;</span><p>Free membership</p></div></div>
<div id="bronzeModal" class="modal"><div class="modal-content"><span class="close">&times;</span><p>Basic benefits</p></div></div>
<div id="silverModal" class="modal"><div class="modal-content"><span class="close">&times;</span><p>Advanced benefits</p></div></div>
<div id="goldModal" class="modal"><div class="modal-content"><span class="close">&times;</span><p>Premium benefits</p></div></div>

</main>

<footer>
<p>&copy; <span id="year"></span> | Femi S. Moses</p>
<p id="lastModified"></p>
</footer>

</body>
</html>
