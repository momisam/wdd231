<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Lagos Business Finder</title>

<link rel="icon" href="images/favicon.ico">

<link rel="stylesheet" href="styles/normalize.css">
<link rel="stylesheet" href="styles/small.css">
<link rel="stylesheet" href="styles/larger.css">

</head>

<body>

<header>
  <h1>Lagos Business Finder</h1>

  <nav>
    <ul class="nav-flex">
      <li><a href="index.html">Home</a></li>
      <li><a href="directory.html">Directory</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

<main>

<section class="contact-modern">

  <!-- LEFT SIDE (FORM) -->
  <div class="contact-left">

    <h2>Contact Us</h2>

    <form action="thankyou.html" method="GET">

      <div class="input-box">
        <input type="text" name="name" placeholder="Name" required>
      </div>

      <div class="input-box">
        <input type="email" name="email" placeholder="Email" required>
      </div>

      <div class="input-box">
        <textarea name="message" placeholder="Message" rows="5" required></textarea>
      </div>

      <button type="submit">Send Message</button>

    </form>

  </div>

  <!-- RIGHT SIDE (IMAGE) -->
  <div class="contact-right">
    <img src="images/contact.png" alt="Contact illustration">
  </div>

</section>

</main>

<footer>
  <p>Contact: info@lagosbusinessfinder.com | +234 8104643664</p>
  <p>&copy; <span id="year"></span> | FEMI S. MOSES | WDD 231</p>
  <p id="lastModified"></p>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("lastModified").textContent = document.lastModified;
</script>

</body>
</html>
